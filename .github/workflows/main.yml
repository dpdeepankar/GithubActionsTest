name: var test

on:
 push: 

permissions: write-all

jobs:
  vartest:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: print value
        run: |
          echo ${{ vars.TEMP_VAR }}
      - name: read file 
        run: cat test.js
      - uses: cschleiden/replace-tokens@v1
        with:
          files: '["**/*.js"]'
      - name: read file again
        run: cat test.js
