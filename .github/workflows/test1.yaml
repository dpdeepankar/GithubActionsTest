name: test1

on:
  push:
    branches:
      - dlv
      - acc
      
  workflow_dispatch: 

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required for actions/checkout (if you use it)
  
jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: test
        run: echo "${{ vars.TEMP_VAR }}"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  reusable1:
    uses: dpdeepankar/GithubActionsTest/.github/workflows/template-test.yml@main

  reusable2:
    runs-on: ubuntu-latest
    steps:
      - name: repository dispatch call
        run: |
         gh api \
         --method POST \
         -H "Accept: application/vnd.github+json" \
         -H "X-GitHub-Api-Version: 2026-03-10" \
         /repos/dpdeepankar/GithubActionsTest/dispatches \
         -f 'event_type=test-template'
    
  
