name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
permissions: 
  contents: read
  pull-requests: write
  
jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Validation
        run: |
          echo "Running validation..."
          sleep 5
          echo "Validation completed successfully!"
